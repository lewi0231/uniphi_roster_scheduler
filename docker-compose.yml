version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roster-scheduler-backend
    ports:
      - "8888:8888"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SOLVER_TIMEOUT_SECONDS=${SOLVER_TIMEOUT_SECONDS:-120.0}
      # SOLVER_NUM_WORKERS is optional - defaults to CPU cores if not set or empty
      - SOLVER_NUM_WORKERS=${SOLVER_NUM_WORKERS:-}
      - ENVIRONMENT=docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - roster-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roster-scheduler-frontend
    ports:
      - "3333:3000"
    environment:
      # Client-side API URL (for browser requests if needed)
      - NEXT_PUBLIC_API_URL=http://localhost:8888
      # Server-side API configuration (required for server actions)
      - BASE_SCHEDULER_URL=http://backend:8888
      - ROSTER_ENDPOINT=/api/v1/roster
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - roster-network

networks:
  roster-network:
    driver: bridge
