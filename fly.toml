# fly.toml app configuration file generated for fastapi-deployment on 2025-01-27T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "roster-scheduler"
primary_region = "iad"  # Washington, D.C. - change to your preferred region

[build]

[env]
  LOG_LEVEL = "INFO"
  ENVIRONMENT = "production"
  SOLVER_TIMEOUT_SECONDS = "120"
  HOURS_OVERAGE_BUFFER_MINUTES = "120"

[http_service]
  internal_port = 8888
  force_https = true
  auto_stop_machines = false  # Keep running for consistent performance
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8888

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

